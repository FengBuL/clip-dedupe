<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
/* Close to Obsidian's default theme variables */
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
.theme-light{--background-primary:#ffffff;--background-primary-alt:#fafafa;--background-secondary:#f6f6f6;--background-modifier-border:#e3e3e3;--background-modifier-hover:rgba(0,0,0,.05);--text-normal:#222222;--text-muted:#5c5c5c;--text-faint:#ababab;--interactive-accent:#8a5cf5;--text-on-accent:#fff;--color-green:#08b94e;--color-orange:#ec7500;--color-red:#e93147;--font-monospace:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#222;background:#fff}
.theme-dark{color-scheme:dark;--background-primary:#1e1e1e;--background-primary-alt:#242424;--background-secondary:#262626;--background-modifier-border:#363636;--background-modifier-hover:rgba(255,255,255,.075);--text-normal:#dadada;--text-muted:#b3b3b3;--text-faint:#666666;--interactive-accent:#8a5cf5;--text-on-accent:#fff;--color-green:#44cf6e;--color-orange:#e9973f;--color-red:#fb464c;--font-monospace:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#dadada;background:#1e1e1e}
.view-content{height:100vh;overflow:auto;padding:16px}
.svg-icon{width:18px;height:18px;stroke-width:2}
button{font-family:inherit;font-size:13px;color:inherit;background:var(--background-primary-alt);border:1px solid var(--background-modifier-border);border-radius:6px;padding:4px 12px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
select.dropdown{font-family:inherit;border:1px solid var(--background-modifier-border);border-radius:6px;background:var(--background-primary-alt);color:inherit;padding:2px 24px 2px 8px}
button.mod-cta{background:var(--interactive-accent);color:#fff;border-color:transparent}
button.mod-warning{background:var(--color-red);color:#fff;border-color:transparent}
button:disabled{opacity:.5}
h1{margin:0}
.modal-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.modal{position:relative;background:var(--background-primary);border:1px solid var(--background-modifier-border);border-radius:12px;padding:24px;max-height:90vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal-title{font-size:20px;font-weight:600;margin-bottom:12px;color:var(--text-normal)}
</style>
<script src="icons.js"></script>
</head><body class="THEME"><div class="view-content-host"></div><script src="bundle.js"></script></body></html>
